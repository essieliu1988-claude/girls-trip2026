<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>我的專屬旅遊紀錄</title>
<style>
  :root {
    --bg-color: #F5F5F0; /* 無印風米白 */
    --primary-color: #8B7355; /* 大地棕 */
    --secondary-color: #9CACA5; /* 鼠尾草綠 */
    --text-color: #4A4A4A;
    --card-bg: #FFFFFF;
  }
  
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 15px;
    line-height: 1.6;
  }

  h1 {
    color: var(--primary-color);
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 20px;
  }

  h2 {
    color: var(--primary-color);
    font-size: 1.2rem;
    border-bottom: 2px solid var(--secondary-color);
    padding-bottom: 8px;
    margin-top: 0;
  }

  /* 獨立分頁區塊設計 */
  .page-block {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }

  /* 表單與輸入框樣式 */
  input[type="text"], input[type="number"], input[type="date"] {
    width: 100%;
    padding: 12px;
    margin: 8px 0 16px;
    border: 1px solid #E0E0E0;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 16px; /* 避免 iPhone 點擊輸入框時自動放大畫面 */
    background-color: #FAFAFA;
  }

  button {
    background-color: var(--primary-color);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    font-size: 16px;
    font-weight: bold;
    transition: background 0.3s;
  }

  button:hover {
    background-color: #705c44;
  }

  /* 清單樣式 */
  ul {
    list-style: none;
    padding: 0;
    margin: 0 0 15px 0;
  }

  li {
    background: var(--bg-color);
    margin-bottom: 10px;
    padding: 12px;
    border-radius: 8px;
    border-left: 4px solid var(--secondary-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.95rem;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
  }

  input[type="checkbox"] {
    transform: scale(1.3);
    accent-color: var(--secondary-color);
  }

  /* 拍照上傳按鈕特化 */
  .upload-label {
    display: inline-block;
    background-color: var(--secondary-color);
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    text-align: center;
    width: 100%;
    box-sizing: border-box;
    font-weight: bold;
  }
  input[type="file"] {
    display: none;
  }
</style>
</head>
<body>

  <h1>我的專屬紀錄</h1>

  <div class="page-block">
    <h2>💰 個人記帳本</h2>
    <div id="expense-list-container">
      <ul id="expense-list">
        </ul>
    </div>
    <input type="text" id="expense-item" placeholder="項目 (例：OMO7 住宿尾款)">
    <input type="number" id="expense-cost" placeholder="金額 (¥)">
    <button onclick="addExpense()">新增花費</button>
  </div>

  <div class="page-block">
    <h2>✅ 行前與購物清單</h2>
    <ul id="todo-list">
      <li>
        <label class="checkbox-label">
          <input type="checkbox"> 確認 6/13 飛大阪航班報到
        </label>
      </li>
      <li>
        <label class="checkbox-label">
          <input type="checkbox"> 預約 KidZania 體驗項目
        </label>
      </li>
      <li>
        <label class="checkbox-label">
          <input type="checkbox"> 環球影城瑪利歐周邊
        </label>
      </li>
    </ul>
    <input type="text" id="new-todo" placeholder="新增清單項目...">
    <button onclick="addTodo()">新增項目</button>
  </div>

  <div class="page-block">
    <h2>📷 隨手拍紀錄</h2>
    <p style="font-size: 0.9rem; color: #777;">點擊下方按鈕可直接開啟相機或相簿</p>
    <label class="upload-label">
      開啟相機 / 相簿
      <input type="file" accept="image/*" capture="environment">
    </label>
  </div>

  <script>
    // 記帳本簡單邏輯 (可搭配 localStorage 進階儲存)
    function addExpense() {
      const itemInput = document.getElementById('expense-item');
      const costInput = document.getElementById('expense-cost');
      
      if(itemInput.value === '' || costInput.value === '') return;

      const list = document.getElementById('expense-list');
      const li = document.createElement('li');
      li.innerHTML = `<span>${itemInput.value}</span> <strong>¥${costInput.value}</strong>`;
      
      list.appendChild(li);
      itemInput.value = '';
      costInput.value = '';
      
      // 可以在這裡加入 localStorage 儲存邏輯
    }

    // 代辦清單簡單邏輯
    function addTodo() {
      const todoInput = document.getElementById('new-todo');
      if(todoInput.value === '') return;

      const list = document.getElementById('todo-list');
      const li = document.createElement('li');
      li.innerHTML = `
        <label class="checkbox-label">
          <input type="checkbox"> ${todoInput.value}
        </label>
      `;
      
      list.appendChild(li);
      todoInput.value = '';
    }
  </script>

</body>
</html>
